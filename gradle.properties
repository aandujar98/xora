# Heap caps are deliberately modest: an 8g development machine also running an emulator cannot back
# a 4g daemon plus a 2g Kotlin daemon, and R8 died on a native allocation when it tried. Metaspace
# stays generous because it is only a ceiling, and 1g of it was not enough to survive a session of
# incremental builds across this many modules; AGP, KSP, and Hilt each load a lot of class metadata.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
# Unbounded workers on a 16-core, 8g host oversubscribe RAM long before they saturate the CPUs.
org.gradle.workers.max=3
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
