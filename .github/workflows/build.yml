name: Build & Release APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          # The action installs the obsolete "tools" package by default, which Google has
          # removed from the SDK repository — sdkmanager now fails with
          # "Failed to find package 'tools'". Everything this build needs is installed
          # explicitly by the next step.
          packages: ''

      - name: Install NDK and CMake
        run: |
          # 27.0.12077973 is pinned by :core:launcher whenever the Discord Social SDK AAR is
          # present — its prefab was built against that NDK — so it has to be installed or the
          # Discord-enabled build cannot configure.
          sdkmanager --install "ndk;27.2.12479018" "ndk;27.0.12077973" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Pre-fetch mGBA (avoids a per-ABI clone race during CMake configure)
        run: |
          MGBA=core/libretro/src/main/cpp/third_party/mgba
          if [ ! -f "$MGBA/CMakeLists.txt" ]; then
            rm -rf "$MGBA"
            git clone --depth 1 https://github.com/mgba-emu/mgba.git "$MGBA"
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Verify APK size
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          SIZE=$(stat -c%s "$APK")
          SIZE_MB=$((SIZE / 1048576))
          echo "APK size: ${SIZE_MB}MB"
          if [ "$SIZE_MB" -lt 80 ]; then
            echo "WARNING: APK is only ${SIZE_MB}MB — native libs may be missing"
          fi

      - name: Compute next version tag
        id: ver
        run: |
          # Tag what the app actually is. Counting up from the old v0.2.x tags published a
          # 0.5.6 build as v0.2.346.
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          VC=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          if [ -z "$VN" ]; then
            echo "Could not read versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          NEXT="v$VN"
          if git rev-parse -q --verify "refs/tags/$NEXT" >/dev/null; then
            NEXT="v$VN-$VC"
          fi
          if git rev-parse -q --verify "refs/tags/$NEXT" >/dev/null; then
            NEXT="v$VN-$VC-$(git rev-parse --short HEAD)"
          fi
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next tag: $NEXT"

      - name: Rename APK
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          DEST="XOrA-${{ steps.ver.outputs.tag }}-release.apk"
          cp "$SRC" "$DEST"
          echo "dest=$DEST" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "XOrA ${{ steps.ver.outputs.tag }}"
          body: "Built from commit ${{ github.sha }}"
          files: ${{ steps.apk.outputs.dest }}
          fail_on_unmatched_files: true
