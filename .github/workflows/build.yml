name: Build & Release APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          GRADLE_OPTS: -Xmx2g -XX:MaxMetaspaceSize=1g

      - name: Read version & tag
        id: ver
        run: |
          VER=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*versionName = "//;s/".*//')
          TAG="v${VER}-$(date +%Y%m%d%H%M)"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          DEST="XOrA-${{ steps.ver.outputs.ver }}-release.apk"
          cp "$SRC" "$DEST"
          echo "dest=$DEST" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "XOrA ${{ steps.ver.outputs.ver }}"
          body: "Built from commit ${{ github.sha }}"
          files: ${{ steps.apk.outputs.dest }}
          fail_on_unmatched_files: true
