name: Build & Release APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Hide Discord AAR (unsupported local AAR in library module)
        run: mv core/launcher/libs/discord_partner_sdk.aar core/launcher/libs/discord_partner_sdk.aar.bak

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Verify APK size
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          SIZE=$(stat -c%s "$APK")
          SIZE_MB=$((SIZE / 1048576))
          echo "APK size: ${SIZE_MB}MB"
          if [ "$SIZE_MB" -lt 80 ]; then
            echo "WARNING: APK is only ${SIZE_MB}MB — native libs may be missing"
          fi

      - name: Compute next version tag
        id: ver
        run: |
          LATEST=$(git tag --list "v0.2.*" | grep -E "^v0\.2\.[0-9]+$" | sort -t. -k3 -n | tail -1)
          if [ -z "$LATEST" ]; then
            NEXT="v0.2.167"
          else
            PATCH=$(echo "$LATEST" | cut -d. -f3)
            NEXT="v0.2.$((PATCH + 1))"
          fi
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next tag: $NEXT"

      - name: Rename APK
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          DEST="XOrA-${{ steps.ver.outputs.tag }}-release.apk"
          cp "$SRC" "$DEST"
          echo "dest=$DEST" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "XOrA ${{ steps.ver.outputs.tag }}"
          body: "Built from commit ${{ github.sha }}"
          files: ${{ steps.apk.outputs.dest }}
          fail_on_unmatched_files: true
